name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Valores só de CI; nunca reutilizar em produção.
  JWT_SECRET: "ci-only-jwt-secret-0123456789abcdef0123456789abcdef"
  DATABASE_URL: "mysql://root:root@127.0.0.1:3306/eldoria_ci"

jobs:
  backend:
    name: Backend (lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eldoria_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar e preparar o banco
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
      - name: Lint e tipos
        working-directory: backend
        run: |
          npx eslint "{src,apps,libs,test}/**/*.ts"
          npx tsc --noEmit -p tsconfig.json
      - name: Build e testes
        working-directory: backend
        env:
          NODE_ENV: test
        run: |
          npm run build
          npm test -- --runInBand
      - name: Exportar OpenAPI
        working-directory: backend
        env:
          NODE_ENV: test
        run: node dist/src/scripts/openapi-export.js
      - name: Conferir contrato versionado
        working-directory: backend
        run: git diff --exit-code ../docs/openapi.json

  frontend:
    name: Frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Lint e build
        working-directory: frontend
        run: |
          npm run api:types:check
          npm run lint
          npm run build
          npx tsc --noEmit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eldoria_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependências
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      - name: Preparar banco e build do backend
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Instalar Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Subir backend
        working-directory: backend
        env:
          NODE_ENV: test
        run: |
          nohup node dist/src/main > /tmp/eldoria-backend.log 2>&1 &
          echo $! > /tmp/eldoria-backend.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend não respondeu:" >&2
          cat /tmp/eldoria-backend.log >&2
          exit 1
      - name: Build do frontend
        working-directory: frontend
        run: npm run build
      - name: Rodar E2E
        working-directory: frontend
        run: npx playwright test
      - name: Parar backend
        if: always()
        run: |
          if [ -f /tmp/eldoria-backend.pid ]; then
            kill "$(cat /tmp/eldoria-backend.pid)" 2>/dev/null || true
          fi
      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
